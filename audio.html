<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Drift: Breach — Audio y admin</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#070d12;color:#ebf9ff;font:14px system-ui,Arial,sans-serif}body{display:flex;flex-direction:column}.soundbar{z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:9px 14px;background:#0e171dee;border-bottom:1px solid #9af6d544}.soundbar strong{color:#c7ff76;letter-spacing:.08em}.soundbar button{border:1px solid #c7ff7655;border-radius:7px;padding:7px 12px;background:#162631;color:#ebf9ff;font-weight:700;cursor:pointer}.soundbar button:hover{border-color:#c7ff76}.soundbar label{display:flex;align-items:center;gap:7px;color:#a7b5bd;font-size:12px}.soundbar input{width:90px;accent-color:#c7ff76}.status{font-size:11px;color:#9af6d5}iframe{display:block;width:100%;flex:1;border:0;background:#080e13}
</style>
</head>
<body>
<div class="soundbar"><strong>NEON DRIFT · SYNTHWAVE</strong><button id="audioToggle">Activar música y efectos</button><label>Volumen <input id="volume" type="range" min="0" max="100" value="35"></label><span class="status" id="status">Abre Admin local en el juego para usar las herramientas.</span></div>
<iframe id="game" title="Neon Drift: Breach" src="./index.html"></iframe>
<script>
(()=>{
 const frame=document.getElementById('game'),button=document.getElementById('audioToggle'),volume=document.getElementById('volume'),status=document.getElementById('status');let audio=null,master=null,music=null,sfx=null,enabled=false,timer=0,step=0,observer=null,lastShot=0,lastScore=0,lastHp='';
 const chords=[[220,277,330],[247,294,370],[196,247,294],[175,220,262],[147,185,220],[110,147,175]];
 function setupAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status.textContent='Audio no disponible en este navegador.';return}audio=new AC();master=audio.createGain();music=audio.createGain();sfx=audio.createGain();music.gain.value=.45;sfx.gain.value=.8;music.connect(master);sfx.connect(master);master.connect(audio.destination);setVolume()}
 function setVolume(){if(master&&audio)master.gain.setTargetAtTime(+volume.value/100,audio.currentTime,.04)}
 function tone(freq,duration=.15,wave='sine',gain=.05,delay=0,dest=sfx){if(!audio||!enabled)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(dest);o.start(t);o.stop(t+duration+.03)}
 function musicTick(){if(!enabled||!audio)return;const n=step%16,bar=Math.floor(step/16)%chords.length,c=chords[bar],level=readLevel(),intensity=Math.min(1.7,.8+(level-1)*.12);if(n%4===0){tone(55*(bar%2?1.12:1),.18,'square',.045,0,music);tone(45,.12,'sine',.055,0,music)}if(n%2===0){tone(c[(n/2)%3]/2,.25,'triangle',.04*intensity,0,music);tone(c[(n/2)%3]*(n%8===0?2:1),.13,'sawtooth',.018*intensity,.025,music)}if(n===7||n===15)tone(c[2]*2,.12,'triangle',.02*intensity,0,music);step++;music.gain.setTargetAtTime(Math.min(.75,.35+level*.025),audio.currentTime,.2)}
 function readLevel(){try{return Math.max(1,+(frame.contentDocument.getElementById('level')?.textContent||1))}catch{return 1}}
 function playShot(){const n=performance.now();if(n-lastShot<100)return;lastShot=n;tone(520,.06,'square',.025);tone(170,.09,'sawtooth',.02,.02)}
 function installAdminBossButton(){try{const doc=frame.contentDocument,actions=doc?.getElementById('adminActions');if(!actions||actions.querySelector('#adminSpawnBoss'))return;if(actions.classList.contains('hidden'))return;const b=doc.createElement('button');b.id='adminSpawnBoss';b.type='button';b.textContent='Invocar jefe';b.style.cssText='width:100%;padding:11px 13px;margin-top:8px;border-radius:8px;border:1px solid #ff6a7a;background:#351922;color:#fff;font-weight:700;cursor:pointer';b.addEventListener('click',()=>{try{frame.contentWindow.eval(`(()=>{if(!adminUnlocked)return;spawnEnemy();const boss=enemies[enemies.length-1];boss.type='brute';boss.isBoss=true;boss.r=30;boss.maxHp=35+state.level*12;boss.hp=boss.maxHp;boss.speed=.72+Math.min(state.level*.01,.25);boss.cooldown=35;updateHud();showToast('¡JEFE INVOCADO!')})()`);status.textContent='Jefe invocado desde el panel de administración.';tone(110,.35,'sawtooth',.08);tone(220,.3,'triangle',.06,.08)}catch(e){status.textContent='No se pudo invocar el jefe; recarga la página y vuelve a entrar al admin.'}});actions.appendChild(b)}catch{}}
 function observeGame(){try{const doc=frame.contentDocument,actions=doc?.getElementById('adminActions');if(!doc||!actions)return;if(observer)observer.disconnect();observer=new MutationObserver(installAdminBossButton);observer.observe(actions,{attributes:true,attributeFilter:['class'],childList:true});installAdminBossButton();const score=doc.getElementById('score'),hp=doc.getElementById('hp');let previousScore=+(score?.textContent||0);lastHp=hp?.textContent||'';const watch=new MutationObserver(()=>{const current=+(score?.textContent||0),currentHp=hp?.textContent||'';if(current>previousScore)tone(760,.12,'triangle',.045);if(lastHp&&currentHp!==lastHp)tone(120,.15,'sine',.05);previousScore=current;lastHp=currentHp;installAdminBossButton()});[score,hp].forEach(el=>el&&watch.observe(el,{childList:true,characterData:true,subtree:true}));doc.addEventListener('keydown',e=>{if(e.key==='Shift'){tone(260,.2,'sine',.06);tone(700,.28,'triangle',.035,.04)}if(e.key===' '||e.key.toLowerCase()==='f')playShot()},true);doc.getElementById('game')?.addEventListener('pointerdown',playShot,true);status.textContent='Juego listo. El botón Invocar jefe aparecerá dentro del Admin local tras iniciar sesión.'}catch{status.textContent='Recarga para conectar el juego y sus controles.'}}
 button.addEventListener('click',async()=>{setupAudio();if(!audio)return;await audio.resume();enabled=!enabled;button.textContent=enabled?'Silenciar música y efectos':'Activar música y efectos';if(enabled){musicTick();timer=setInterval(musicTick,180)}else clearInterval(timer)});volume.addEventListener('input',setVolume);frame.addEventListener('load',observeGame);setTimeout(observeGame,600);
})();
</script>
</body>
</html>
