<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Drift: Breach — Juego, tienda y audio</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#070d12;color:#ebf9ff;font:14px system-ui,Arial,sans-serif}body{display:flex;flex-direction:column}.toolbar{z-index:5;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:9px 14px;background:#0e171dee;border-bottom:1px solid #9af6d544}.toolbar strong{color:#c7ff76;letter-spacing:.08em}.toolbar button,.shop button{border:1px solid #c7ff7655;border-radius:7px;padding:8px 12px;background:#162631;color:#ebf9ff;font-weight:700;cursor:pointer}.toolbar button:hover,.shop button:hover{border-color:#c7ff76;background:#203642}.toolbar label{display:flex;align-items:center;gap:7px;color:#a7b5bd;font-size:12px}.toolbar input{width:85px;accent-color:#c7ff76}.status{font-size:11px;color:#9af6d5}.wallet{color:#c7ff76;font-weight:800}iframe{display:block;width:100%;flex:1;border:0;background:#080e13}.shopBackdrop{position:fixed;inset:0;z-index:10;background:#02070bd9;display:grid;place-items:center;padding:16px}.shop{width:min(94vw,560px);max-height:90vh;overflow:auto;background:#0e171d;border:1px solid #9af6d577;border-radius:14px;padding:20px;box-shadow:0 18px 70px #000c}.shop h2{margin:0;color:#c7ff76}.shop p{color:#a7b5bd;line-height:1.5}.shopHeader{display:flex;align-items:center;justify-content:space-between;gap:12px}.shopGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.shopItem{padding:12px;border:1px solid #ffffff20;background:#111c24;border-radius:9px}.shopItem b{color:#9af6d5}.shopItem p{font-size:12px;margin:6px 0}.shopItem button{width:100%;margin-top:5px}.shop .close{background:#351922;border-color:#ff6a7a}.hidden{display:none!important}
</style>
</head>
<body>
<div class="toolbar"><strong>NEON DRIFT</strong><button id="audioToggle">Activar música y efectos</button><button id="shopOpen">Tienda</button><span class="wallet">Créditos: <span id="credits">0</span></span><label>Volumen <input id="volume" type="range" min="0" max="100" value="35"></label><span class="status" id="status">Elige Tienda durante una partida; consigue créditos al derrotar enemigos.</span></div>
<div id="shopBackdrop" class="shopBackdrop hidden"><section class="shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle"><div class="shopHeader"><h2 id="shopTitle">Tienda de equipo</h2><button class="close" id="shopClose">Cerrar</button></div><p>Los enemigos derrotados te dan créditos. Comprar pausa la partida; al cerrar, continúa. Los créditos son de la partida actual.</p><div class="shopGrid" id="shopGrid"></div></section></div>
<iframe id="game" title="Neon Drift: Breach" src="./index.html"></iframe>
<script>
(()=>{
 const frame=document.getElementById('game'),audioButton=document.getElementById('audioToggle'),shopOpen=document.getElementById('shopOpen'),shopClose=document.getElementById('shopClose'),backdrop=document.getElementById('shopBackdrop'),grid=document.getElementById('shopGrid'),creditText=document.getElementById('credits'),volume=document.getElementById('volume'),status=document.getElementById('status');
 let audio=null,master=null,musicGain=null,sfxGain=null,audioOn=false,musicTimer=0,musicStep=0,previousScore=0,observer=null,wasPaused=false;
 const items=[
  {id:'shotgun',name:'Escopeta',desc:'Dispara una ráfaga de cinco proyectiles.',price:100,code:"setWeapon('shotgun')"},
  {id:'laser',name:'Láser',desc:'Disparo veloz y de alta cadencia.',price:150,code:"setWeapon('laser')"},
  {id:'railgun',name:'Railgun',desc:'Proyectil lento con gran daño.',price:200,code:"setWeapon('railgun')"},
  {id:'damage',name:'Daño +1',desc:'Aumenta el daño de cada proyectil.',price:80,code:'state.damage++'},
  {id:'cadence',name:'Cadencia +',desc:'Dispara más seguido.',price:100,code:'state.fireRate=Math.max(2,state.fireRate-2)'},
  {id:'repair',name:'Reparación',desc:'Recupera vida y aumenta la vida máxima.',price:70,code:'state.maxHp+=2;state.hp=Math.min(state.maxHp,state.hp+5)'},
  {id:'shield',name:'Escudo +1',desc:'Añade un impacto de escudo.',price:90,code:'state.shield++'},
  {id:'turbo',name:'Turbo',desc:'Aumenta la velocidad de movimiento.',price:80,code:'state.moveSpeed=Math.min(8,state.moveSpeed+.45)'}
 ];
 function ensureAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status.textContent='Audio no disponible en este navegador.';return}audio=new AC();master=audio.createGain();musicGain=audio.createGain();sfxGain=audio.createGain();musicGain.gain.value=.4;sfxGain.gain.value=.75;musicGain.connect(master);sfxGain.connect(master);master.connect(audio.destination);setVolume()}
 function setVolume(){if(master&&audio)master.gain.setTargetAtTime(+volume.value/100,audio.currentTime,.05)}
 function tone(freq,duration=.16,wave='sine',gain=.04,delay=0,dest=sfxGain){if(!audio||!audioOn)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(dest);o.start(t);o.stop(t+duration+.03)}
 function musicTick(){if(!audioOn)return;const notes=[110,130.81,146.83,164.81,196,220,246.94,293.66],n=musicStep%8,level=readLevel(),heat=Math.min(1.7,.8+level*.1);if(n%4===0)tone(55,.15,'square',.045,0,musicGain);tone(notes[n]*2,.12,n%2?'sawtooth':'triangle',.012*heat,0,musicGain);if(n%2===0)tone(notes[(n+3)%8],.2,'triangle',.028*heat,0,musicGain);musicStep++;musicGain.gain.setTargetAtTime(Math.min(.7,.3+level*.025),audio.currentTime,.2)}
 function readLevel(){try{return Math.max(1,+frame.contentDocument.getElementById('level').textContent||1)}catch{return 1}}
 function getGameValue(expression){try{return frame.contentWindow.eval(expression)}catch{return null}}
 function syncCredits(){const value=getGameValue('window.__shopCredits||0');creditText.textContent=Number(value)||0}
 function initShop(){grid.replaceChildren();for(const item of items){const card=document.createElement('article');card.className='shopItem';const title=document.createElement('b');title.textContent=item.name;const info=document.createElement('p');info.textContent=`${item.desc} · ${item.price} créditos`;const buy=document.createElement('button');buy.textContent='Comprar';buy.addEventListener('click',()=>buyItem(item));card.append(title,info,buy);grid.appendChild(card)}}
 function buyItem(item){try{const code=JSON.stringify(item.code);const result=frame.contentWindow.eval(`(()=>{if(!state.running)return 'Empieza una partida primero.';const balance=Number(window.__shopCredits||0);if(balance<${item.price})return 'No tienes créditos suficientes.';window.__shopCredits=balance-${item.price};${JSON.parse(code)};updateHud();showToast(${JSON.stringify(item.name+' comprado')});return 'ok'})()`);syncCredits();if(result==='ok'){status.textContent=`Compraste ${item.name}.`;tone(660,.1,'triangle',.055);tone(880,.16,'sine',.04,.08)}else status.textContent=result||'No se pudo completar la compra.'}catch{status.textContent='No se pudo conectar con la partida. Recarga el juego.'}}
 function openShop(){try{const running=getGameValue('state.running');if(!running){status.textContent='Inicia una partida para usar la tienda.';return}wasPaused=!!getGameValue('state.paused');frame.contentWindow.eval('state.paused=true');backdrop.classList.remove('hidden');syncCredits()}catch{status.textContent='No se pudo abrir la tienda. Recarga la página.'}}
 function closeShop(){backdrop.classList.add('hidden');try{frame.contentWindow.eval(`state.paused=${wasPaused?'true':'false'};ui.pause.classList.toggle('hidden',!state.paused);updateHud()`)}catch{} }
 function installGameHooks(){try{const doc=frame.contentDocument,score=doc?.getElementById('score');if(!doc||!score)return;if(observer)observer.disconnect();previousScore=Number(score.textContent)||0;observer=new MutationObserver(()=>{const next=Number(score.textContent)||0;if(next<previousScore){frame.contentWindow.__shopCredits=0}else if(next>previousScore){frame.contentWindow.__shopCredits=(Number(frame.contentWindow.__shopCredits)||0)+(next-previousScore)}previousScore=next;syncCredits()});observer.observe(score,{childList:true,characterData:true,subtree:true});for(const id of ['startBtn','againBtn','restartBtn'])doc.getElementById(id)?.addEventListener('click',()=>{frame.contentWindow.__shopCredits=0;previousScore=0;syncCredits()});status.textContent='Tienda lista. Cada enemigo derrotado otorga créditos.'}catch{status.textContent='El juego está cargando; vuelve a intentarlo en unos segundos.'}}
 audioButton.addEventListener('click',async()=>{ensureAudio();if(!audio)return;await audio.resume();audioOn=!audioOn;audioButton.textContent=audioOn?'Silenciar música':'Activar música y efectos';if(audioOn){musicStep=0;musicTick();musicTimer=setInterval(musicTick,190)}else clearInterval(musicTimer)});
 shopOpen.addEventListener('click',openShop);shopClose.addEventListener('click',closeShop);backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeShop()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!backdrop.classList.contains('hidden'))closeShop()});volume.addEventListener('input',setVolume);frame.addEventListener('load',installGameHooks);initShop();setTimeout(installGameHooks,700);
})();
</script>
</body>
</html>
