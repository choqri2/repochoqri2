<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba: disparo automático</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e13;color:#eef8f3;font:15px system-ui,Arial,sans-serif}.wrap{width:min(96vw,900px)}h1{font-size:clamp(22px,4vw,34px);margin:0 0 6px;color:#c7ff76}.desc{margin:0 0 12px;color:#b9c8c8}.hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}.badge{background:#122027;border:1px solid #ffffff24;border-radius:8px;padding:8px 11px}canvas{display:block;width:100%;height:auto;background:#0d171b;border:1px solid #9af6d555;border-radius:8px}.hint{font-size:13px;color:#aab8bc;margin-top:8px}kbd{padding:2px 6px;border-radius:4px;background:#23343a;color:#c7ff76}button{border:1px solid #c7ff7655;border-radius:7px;padding:7px 12px;background:#172a2c;color:#eef8f3;cursor:pointer}
</style>
</head>
<body><main class="wrap"><h1>Prueba de disparo automático</h1><p class="desc">La nave apunta al robot más cercano y dispara sola mientras AUTO FIRE esté activado.</p><div class="hud"><span class="badge" id="fireState">AUTO FIRE: ON</span><span class="badge" id="target">Objetivo: buscando…</span><span class="badge" id="hits">Impactos: 0</span><button id="toggle">Desactivar (F)</button></div><canvas id="demo" width="900" height="500" aria-label="Demostración de auto-disparo"></canvas><p class="hint">Muévete con <kbd>WASD</kbd> o flechas. Pulsa <kbd>F</kbd> para activar/desactivar el disparo automático.</p></main>
<script>
const canvas=document.querySelector('#demo'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
const player={x:450,y:250,r:13,speed:3.7};const keys={};const shots=[];let enabled=true,hits=0,frame=0;
const bots=Array.from({length:6},(_,i)=>({x:100+Math.random()*700,y:70+Math.random()*350,r:14,hp:1,vx:(Math.random()-.5)*1.3,vy:(Math.random()-.5)*1.3,phase:i}));
function nearest(){let result=null,best=Infinity;for(const bot of bots){const d=(player.x-bot.x)**2+(player.y-bot.y)**2;if(d<best){best=d;result=bot}}return result}
function toggle(){enabled=!enabled;$('#fireState').textContent=`AUTO FIRE: ${enabled?'ON':'OFF'}`;$('#toggle').textContent=enabled?'Desactivar (F)':'Activar (F)'}
$('#toggle').addEventListener('click',toggle);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='f'&&!e.repeat)toggle()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function shoot(target){if(!target)return;const a=Math.atan2(target.y-player.y,target.x-player.x);shots.push({x:player.x+Math.cos(a)*17,y:player.y+Math.sin(a)*17,vx:Math.cos(a)*8,vy:Math.sin(a)*8,life:100});}
function respawn(bot){bot.x=50+Math.random()*800;bot.y=50+Math.random()*400;bot.hp=1;bot.vx=(Math.random()-.5)*1.3;bot.vy=(Math.random()-.5)*1.3}
function update(){frame++;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.x=Math.max(player.r,Math.min(900-player.r,player.x+dx*player.speed));player.y=Math.max(player.r,Math.min(500-player.r,player.y+dy*player.speed));for(const b of bots){b.x+=b.vx;b.y+=b.vy;b.phase+=.04;if(b.x<b.r||b.x>900-b.r)b.vx*=-1;if(b.y<b.r||b.y>500-b.r)b.vy*=-1}const target=nearest();if(enabled&&frame%18===0)shoot(target);for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx;s.y+=s.vy;s.life--;let remove=s.life<=0||s.x<0||s.x>900||s.y<0||s.y>500;for(const b of bots){if(!remove&&Math.hypot(s.x-b.x,s.y-b.y)<b.r+4){remove=true;hits++;respawn(b);break}}if(remove)shots.splice(i,1)}$('#target').textContent=target?`Objetivo: a ${Math.round(Math.hypot(target.x-player.x,target.y-player.y))} px`:'Objetivo: ninguno';$('#hits').textContent=`Impactos: ${hits}`}
function draw(){ctx.clearRect(0,0,900,500);ctx.fillStyle='#0c1519';ctx.fillRect(0,0,900,500);ctx.strokeStyle='#ffffff0b';for(let x=0;x<900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}const target=nearest();if(target){ctx.strokeStyle=enabled?'#c7ff7680':'#9af6d540';ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(target.x,target.y);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(target.x,target.y,target.r+7,0,Math.PI*2);ctx.strokeStyle='#c7ff76';ctx.stroke()}for(const b of bots){ctx.fillStyle='#ff9b4d';ctx.shadowColor='#ff9b4d';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(const s of shots){ctx.fillStyle='#a5ffda';ctx.shadowColor='#a5ffda';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;const a=target?Math.atan2(target.y-player.y,target.x-player.x):0;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle='#d5fff0';ctx.strokeStyle='#78eabb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-11,9);ctx.lineTo(-7,0);ctx.lineTo(-11,-9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
