<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Drift · Auto-fire</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e13;color:#eef8f3;font:15px system-ui,Arial,sans-serif}.wrap{width:min(96vw,900px)}h1{font-size:clamp(22px,4vw,34px);margin:0 0 6px;color:#c7ff76}.desc{margin:0 0 12px;color:#b9c8c8}.hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}.badge{background:#122027;border:1px solid #ffffff24;border-radius:8px;padding:8px 11px}canvas{display:block;width:100%;height:auto;background:#0d171b;border:1px solid #9af6d555;border-radius:8px}.hint{font-size:13px;color:#aab8bc;margin-top:8px}kbd{padding:2px 6px;border-radius:4px;background:#23343a;color:#c7ff76}
</style>
</head>
<body><main class="wrap"><h1>Neon Drift · Disparo automático</h1><p class="desc">La nave apunta al robot más cercano y dispara balas automáticamente.</p><div class="hud"><span class="badge">AUTO FIRE: SIEMPRE ACTIVO</span><span class="badge" id="target">Buscando objetivo…</span><span class="badge" id="shots">Balas disparadas: 0</span><span class="badge" id="hits">Impactos: 0</span></div><canvas id="game" width="900" height="500" aria-label="Juego con disparo automático"></canvas><p class="hint">Muévete con <kbd>WASD</kbd> o las flechas. No hace falta pulsar el botón de disparo: la nave apunta y dispara por sí sola.</p></main>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s),keys={};
const player={x:450,y:250,r:13,speed:3.7};let frame=0,totalShots=0,hits=0;const bullets=[];
const bots=Array.from({length:7},(_,i)=>({x:60+Math.random()*780,y:45+Math.random()*410,r:13+Math.random()*4,hp:1,vx:(Math.random()-.5)*1.25,vy:(Math.random()-.5)*1.25,phase:i}));
function nearest(){let target=null,best=Infinity;for(const b of bots){const d=(player.x-b.x)**2+(player.y-b.y)**2;if(d<best){best=d;target=b}}return target}
function fire(target){if(!target)return;const a=Math.atan2(target.y-player.y,target.x-player.x);bullets.push({x:player.x+Math.cos(a)*17,y:player.y+Math.sin(a)*17,vx:Math.cos(a)*8.5,vy:Math.sin(a)*8.5,life:110});totalShots++}
function respawn(bot){bot.x=50+Math.random()*800;bot.y=40+Math.random()*420;bot.hp=1;bot.vx=(Math.random()-.5)*1.25;bot.vy=(Math.random()-.5)*1.25}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function update(){frame++;const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.x=Math.max(player.r,Math.min(900-player.r,player.x+dx*player.speed));player.y=Math.max(player.r,Math.min(500-player.r,player.y+dy*player.speed));for(const b of bots){b.x+=b.vx;b.y+=b.vy;b.phase+=.04;if(b.x<b.r||b.x>900-b.r)b.vx*=-1;if(b.y<b.r||b.y>500-b.r)b.vy*=-1}const target=nearest();if(frame%16===0)fire(target);for(let i=bullets.length-1;i>=0;i--){const s=bullets[i];s.x+=s.vx;s.y+=s.vy;s.life--;let remove=s.life<=0||s.x<0||s.x>900||s.y<0||s.y>500;for(const b of bots){if(!remove&&Math.hypot(s.x-b.x,s.y-b.y)<b.r+4){remove=true;hits++;respawn(b);break}}if(remove)bullets.splice(i,1)}$('#target').textContent=target?`Objetivo más cercano: ${Math.round(Math.hypot(target.x-player.x,target.y-player.y))} px`:'Buscando objetivo…';$('#shots').textContent=`Balas disparadas: ${totalShots}`;$('#hits').textContent=`Impactos: ${hits}`}
function draw(){ctx.clearRect(0,0,900,500);ctx.fillStyle='#0c1519';ctx.fillRect(0,0,900,500);ctx.strokeStyle='#ffffff0b';for(let x=0;x<900;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=0;y<500;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}const target=nearest();if(target){ctx.strokeStyle='#c7ff7688';ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(target.x,target.y);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(target.x,target.y,target.r+7,0,Math.PI*2);ctx.strokeStyle='#c7ff76';ctx.stroke()}for(const b of bots){ctx.fillStyle='#ff9b4d';ctx.shadowColor='#ff9b4d';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(const s of bullets){ctx.fillStyle='#a5ffda';ctx.shadowColor='#a5ffda';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;const a=target?Math.atan2(target.y-player.y,target.x-player.x):0;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle='#d5fff0';ctx.strokeStyle='#78eabb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-11,9);ctx.lineTo(-7,0);ctx.lineTo(-11,-9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
